# SIMULATION HARNESS for awslabs/aws-crt-builder pre-merge-checks. Never merged.
# Frozen: change behaviour in aws-crt-builder (sim/pre-merge), never here.
# pull_request instead of pull_request_target, which only runs from the default branch.
name: Pre-merge checks

on:
  pull_request:
    branches: [pre-merge]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

concurrency:
  group: pre-merge-${{ github.event.pull_request.number }}

jobs:
  pre-merge:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      statuses: write
    uses: awslabs/aws-crt-builder/.github/workflows/pre-merge-checks.yml@sim/pre-merge
    with:
      lib-name: aws-c-common
      approval-environment: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'customer-env' || '' }}
    secrets:
      CRT_CI_ROLE_ARN: ${{ secrets.CRT_CI_ROLE_ARN }}
