# SIMULATION HARNESS for awslabs/aws-crt-builder pre-merge-checks. Never merged.
name: Pre-merge checks

on:
  push:
    branches-ignore: ['main']
  pull_request:
    types: [opened, reopened, edited, labeled, unlabeled]

concurrency:
  group: pre-merge-${{ github.event.pull_request.head.ref || github.ref_name }}

jobs:
  pre-merge:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      statuses: write
    uses: awslabs/aws-crt-builder/.github/workflows/pre-merge-checks.yml@sim/premerge-v2
    with:
      lib-name: aws-c-common
    secrets:
      CRT_CI_ROLE_ARN: ${{ secrets.CRT_CI_ROLE_ARN }}
