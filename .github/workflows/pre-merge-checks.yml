# SIMULATION HARNESS for awslabs/aws-crt-builder pre-merge-checks. Never merged.
# The caller from the workflow's header, on pull_request (the internal-developer path).
name: Pre-merge checks

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

concurrency:
  group: pre-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action) || github.event.changes.base != null }}

jobs:
  pre-merge:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      statuses: write
    uses: awslabs/aws-crt-builder/.github/workflows/pre-merge-checks.yml@sim/premerge-v2
    with:
      lib-name: aws-c-common
      approval-label: ci-ready
    secrets:
      CRT_CI_ROLE_ARN: ${{ secrets.CRT_CI_ROLE_ARN }}
