# SIMULATION HARNESS for awslabs/aws-crt-builder pre-merge-checks. Never merged.
name: Pre-merge checks

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

concurrency:
  group: pre-merge-${{ github.event.pull_request.number }}-${{ github.event_name }}

jobs:
  same-repo:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      statuses: write
    uses: awslabs/aws-crt-builder/.github/workflows/pre-merge-checks.yml@sim/premerge-v2
    with:
      lib-name: aws-c-common
      approval-label: ci-ready
      gate-same-repo: true
    secrets:
      CRT_CI_ROLE_ARN: ${{ secrets.CRT_CI_ROLE_ARN }}

  fork:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      statuses: write
    uses: awslabs/aws-crt-builder/.github/workflows/pre-merge-checks.yml@sim/premerge-v2
    with:
      lib-name: aws-c-common
      approval-label: ci-ready
    secrets:
      CRT_CI_ROLE_ARN: ${{ secrets.CRT_CI_ROLE_ARN }}
