# Everything that must be true before a pull request merges.
#
# Replaces check-abi.yml (on: push, which a fork's push never raises here) and
# block-needs-review.yml (whose gate now runs in the same run as the ABI check
# that produces the label).
#
# This file is scaffolding only and is identical in every consumer apart from
# `lib-name`. All logic lives in aws-crt-builder, so behaviour changes are one
# edit there rather than a pull request per repository.
#
# Naming: this workflow is "Pre-merge checks", the caller job below is `upkeep`,
# and the called workflow's jobs are `approval`, `abi-compat`, `changelog` and
# `verdict-gate`. The merge box therefore reads
# "Pre-merge checks / upkeep / abi-compat", and the required-check contexts --
# the strings stored in the branch ruleset -- are "upkeep / abi-compat" and so
# on. The called workflow's own name never appears anywhere.
name: Pre-merge checks

on:
  # pull_request_target, not pull_request: a fork's push raises no event in this
  # repository, and only a base-repo token can label a pull request.
  pull_request_target:
    types:
      # code, and the changelog fragment, may have changed
      - opened
      - reopened
      - synchronize
      # the only signal for a title change, and for a base-branch retarget
      - edited
      # skip-changelog toggled, or a maintainer replacing needs-review
      - labeled
      - unlabeled

  # TEMPORARY TEST HARNESS -- REMOVE BEFORE MERGING TO main.
  # pull_request_target reads this file from the default branch, so nothing on
  # this branch can trigger it. pull_request reads from the merge ref.
  # Same-repo pull requests only: a fork PR on this event gets no secrets.
  pull_request:
    branches:
      - chore/pre-merge
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

# Keyed on the pull request number: under pull_request_target github.ref is the
# base branch for every pull request, so a github.ref group would collapse them
# all into one. Not cancel-in-progress: cancelling a run parked on a human
# approval would discard that approval.
concurrency:
  group: pre-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # DO NOT rename, and do not add an `if:` or a `needs:`.
  #
  # This job's id is the first segment of every required-check context --
  # "upkeep / abi-compat", "upkeep / verdict-gate" -- and those strings are
  # stored in the branch ruleset. Renaming it orphans every entry.
  #
  # It must also stay structurally unskippable: a skipped caller job reports its
  # own bare name instead of the nested contexts, so any required context would
  # sit at "Expected" forever. All conditional logic lives in the called
  # workflow.
  upkeep:
    # A caller must declare the union of what the called jobs request: the
    # default token is read-only and a called workflow can only downgrade.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      checks: read
      statuses: write
    # TODO: pin back to @main once this workflow is on main.
    uses: awslabs/aws-crt-builder/.github/workflows/pre-merge-checks.yml@feat/pre-merge-checks
    with:
      lib-name: aws-c-common
      # Operand order matters: `cond && '' || 'x'` always yields 'x', because ''
      # is falsy. The truthy branch must carry the non-empty value.
      approval-environment: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'customer-env' || '' }}
    secrets:
      # Named rather than `secrets: inherit`, which would hand the called
      # workflow every secret this repository can see.
      CRT_CI_ROLE_ARN: ${{ secrets.CRT_CI_ROLE_ARN }}
