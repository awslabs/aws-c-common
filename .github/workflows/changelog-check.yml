name: Changelog Check
on:
  pull_request:
    branches: [test-main]
    types: [opened, edited, synchronize, reopened]
jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: awslabs/aws-crt-builder/.github/actions/changelog@cl/7-workflows
        with:
          mode: check
