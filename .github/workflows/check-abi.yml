name: Check ABI compliance

# Trigger on any push to non-main branches.
on:
  push:
    branches-ignore:
      - 'main'

concurrency:
  group: check-abi-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_NAME: aws-c-common
  CRT_CI_ROLE: ${{ secrets.CRT_CI_ROLE_ARN }}
  AWS_DEFAULT_REGION: us-east-1

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  check-abi:
    name: check-abi
    runs-on: ubuntu-24.04
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.CRT_CI_ROLE }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ABI
        uses: awslabs/aws-crt-builder/.github/actions/check-abi@main
        with:
          lib-name: ${{ env.PACKAGE_NAME }}
          builder-version: latest
          builder-source: releases
