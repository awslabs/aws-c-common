name: Block needs-review merges

# Trigger on push to non-main branches only, matching ci.yml. Fork PRs can't
# access repo secrets and would fail; a maintainer pushing to a branch on this
# repo runs the gate with secrets available.
on:
  push:
    branches-ignore:
      - 'main'

permissions:
  pull-requests: read

jobs:
  gate:
    uses: awslabs/aws-crt-builder/.github/workflows/block-needs-review-label.yml@main
